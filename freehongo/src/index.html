<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Freehongo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      .app-bootstrap-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #171a21;
        color: #f2f0eb;
        font-family: 'Poppins', 'Noto Sans JP Variable', sans-serif;
        font-weight: 300;
        font-style: normal;
        font-size: 1.5rem;
      }

      .app-bootstrap-loading::after {
        content: 'Loading Freehongo...';
      }
    </style>
    <link rel="preconnect" href="https://accounts.google.com" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <app-root>
      <div class="app-bootstrap-loading" role="status" aria-live="polite"></div>
    </app-root>
  </body>
</html>
