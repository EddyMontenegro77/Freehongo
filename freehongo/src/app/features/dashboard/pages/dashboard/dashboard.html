@if (isLoading()) {
  <app-loading-state message="Building dashboard..." />
} @else {
  @if (generalSummary(); as summary) {
    <app-summary [data]="summary" />
  }
  @if (categoriesProgress(); as categories) {
    <app-categories [data]="categories" />
  }
  @if (skillsProgress(); as skills) {
    <app-skills [data]="skills" />
  }
  @if (trends(); as trends) {
    <app-trends [data]="trends" />
  }
  @if (weakCharacters()) {
    <app-weak-chars [data]="weakCharacters()" />
  }
  @if (practicedCharacters()) {
    <app-master-details [data]="practicedCharacters()" />
  }
  <app-quiz-history />
  <app-progressbar [value]="55" [milestones]="milestones" barAriaLabel="Test Progress bar" />
}
