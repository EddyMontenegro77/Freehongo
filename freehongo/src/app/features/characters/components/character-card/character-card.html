<div class="character-card-wrapper">
  <app-card variant="elevated" size="md">
    <div card-header>
      <label class="char__label">{{ unicode() }}</label>
    </div>
    <div card-body>
      <p class="char__literal">{{ literal() }}</p>
    </div>
    <div card-footer class="open__btns">
      <app-action-btn
        class="btn-normal"
        title="Practice"
        [action]="openWritingPractice"
        variant="primary"
      />
      <app-action-btn
        class="btn-normal"
        title="Details"
        [action]="openCharacterDetails"
        variant="accent"
      />
      <app-action-btn
        class="btn-full-width"
        title="Practice"
        [fullWidth]="true"
        [action]="openWritingPractice"
        variant="primary"
      />
      <app-action-btn
        class="btn-full-width"
        [fullWidth]="true"
        title="Details"
        [action]="openCharacterDetails"
        variant="accent"
      />
    </div>
  </app-card>
</div>
