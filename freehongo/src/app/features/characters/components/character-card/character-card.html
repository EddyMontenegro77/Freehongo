<div class="character-card-wrapper">
  <app-card variant="elevated" size="md">
    <div card-header>
      <label class="char__label">{{ unicode() }}</label>
    </div>
    <div card-body>
      <p class="char__literal">{{ literal() }}</p>
    </div>
    <div card-footer class="open__btns">
      <app-action-btn title="Practice" [action]="openWritingPractice"></app-action-btn>
      <app-action-btn title="Details" [action]="openCharacterDetails"></app-action-btn>
    </div>
  </app-card>
</div>
