<main class="strokes-quiz">
  @if (isFinished()) {
    <app-stroke-quiz-summary
      [mode]="mode()"
      [results]="orderedResults()"
      (retryRequested)="retry()"
      (exitRequested)="exit()"
    />
  } @else if (isReady()) {
    <header class="quiz-header">
      <div class="quiz-prompt">
        <div class="quiz-prompt__prev">
          @if (mode() === 'practice') {
            <app-action-btn
              title="Previous"
              variant="outline"
              [action]="previousCharacter"
              [disabled]="isFirstCharacter()"
            />
          }
        </div>

        <div class="quiz-prompt__character">
          <h1 class="prompt-instruction">Write the next character in the canvas</h1>
          <strong class="current-character">
            {{ currentCharacter() | unicodeCharacter }}
          </strong>
        </div>

        <div class="quiz-prompt__next">
          @if (isLastCharacter()) {
            <app-action-btn title="Finish" [action]="finish" variant="accent" />
          } @else {
            <app-action-btn title="Next" [action]="nextCharacter" variant="accent" />
          }
        </div>
      </div>

      <app-progressbar
        [value]="progress()"
        [max]="100"
        [milestones]="milestones()"
        variant="accent"
        barAriaLabel="Quiz progress"
      />
    </header>
    <section>
      <app-writing-practice
        card-body
        [unicode]="currentCharacter()"
        [ui]="writingUi()"
        [type]="type()"
        (validationCompleted)="onValidationCompleted($event)"
      />
    </section>
  }
</main>
