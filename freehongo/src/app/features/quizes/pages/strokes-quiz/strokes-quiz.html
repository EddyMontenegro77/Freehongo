<main class="strokes-quiz">
  @if (isFinished()) {
    <app-stroke-quiz-summary
      [mode]="mode()"
      [results]="orderedResults()"
      (retryRequested)="retry()"
      (exitRequested)="exit()"
    />
  } @else if (isReady()) {
    <header class="quiz-header">
      <h1 class="prompt-instruction">
        Write the next character in the canvas:
        <strong class="current-character">{{ currentCharacter() | unicodeCharacter }}</strong>
      </h1>

      <nav class="quiz-nav" aria-label="quiz-navigation">
        <div class="quiz-nav__prev">
          @if (mode() === 'practice') {
            <app-action-btn
              title="Previous"
              [action]="previousCharacter"
              [disabled]="isFirstCharacter()"
              variant="primary"
            />
          }
        </div>

        <span class="quiz-progress" aria-live="polite">{{ progressLabel() }}</span>

        <div class="quiz-nav__next">
          @if (isLastCharacter()) {
            <app-action-btn title="Finish" [action]="finish" variant="light" />
          } @else {
            <app-action-btn title="Next" [action]="nextCharacter" variant="accent" />
          }
        </div>
      </nav>
    </header>

    <app-writing-practice
      [unicode]="currentCharacter()"
      [ui]="writingUi()"
      [type]="type()"
      (validationCompleted)="onValidationCompleted($event)"
    />
  }
</main>
