<div class="writing-canvas-container">
  <section class="canvas-section" aria-label="canvas-section">
    <div class="canvas-stage">
      <canvas
        #writingCanvas
        (pointerdown)="onPointerDown($event)"
        (pointerup)="onPointerUp($event)"
        (pointermove)="onPointerMove($event)"
        [width]="width()"
        [height]="height()"
      >
      </canvas>

      @if (ui().showExpectedPreview && showPreview()) {
        <app-writing-stroke-guide
          class="canvas-overlay"
          [strokes]="expectedStrokes()"
          [width]="width()"
          [height]="height()"
        />
      }
    </div>

    <section class="canvas-tools" aria-label="canvas-tools">
      <app-action-btn title="Undo" [action]="undoStroke" />
      <app-action-btn title="Redo" [action]="redoStroke" />
      <app-action-btn title="Reset" [action]="resetCanvas" />
      @if (ui().showExpectedPreview) {
        <app-action-btn
          [title]="showPreview() ? 'Hide guide' : 'Show guide'"
          [action]="togglePreview"
        />
        @if (showPreview()) {
          <app-action-btn title="Replay" [action]="replayGuide" />
        }
      }
    </section>

    @if (ui().showValidateButton) {
      <app-action-btn
        class="validate-btn"
        title="Validate"
        [action]="getSequenceValidationResults"
      />
    }
  </section>

  @if (ui().showValidationResults) {
    <app-writing-validation
      [expectedUrl]="expectedUrl()"
      [hasValidationResults]="hasValidationResults"
      [isValidSequence]="isValidSequence"
      [sequenceError]="sequenceError"
      [strokeResults]="strokeResults"
    />
  }
</div>
