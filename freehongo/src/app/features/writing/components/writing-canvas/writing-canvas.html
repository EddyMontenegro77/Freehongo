<div class="writing-canvas-container">
  <section class="canvas-section" aria-label="canvas-section">
    <canvas
      #writingCanvas
      (pointerdown)="onPointerDown($event)"
      (pointerup)="onPointerUp($event)"
      (pointermove)="onPointerMove($event)"
      [width]="width()"
      [height]="height()"
    >
    </canvas>
    <app-action-btn title="Validate" [action]="getSequenceValidationResults" />
    <app-action-btn title="Reset" [action]="resetCanvas" />
    <app-action-btn title="Undo" [action]="undoStroke" />
    <app-action-btn title="Redo" [action]="redoStroke" />
  </section>
  <section class="validation-section" aria-label="validation-section">
    @if (!hasValidationResults) {
      <label>Draw and press "Validate" to get the results</label>
      <img class="" alt="expected strokes preview" [src]="expectedUrl()" />
    } @else {
      @if (isValidSequence) {
        <label>Correct Sequence</label>
      } @else {
        <img class="" alt="expected strokes preview" [src]="expectedUrl()" />
        <label>Sequence is not valid: {{ sequenceError }}</label>
        <app-table [headers]="tableConfig.columns" [rows]="tableConfig.rows"></app-table>
      }
    }
  </section>
</div>
