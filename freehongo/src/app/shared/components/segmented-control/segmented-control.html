<div class="segmented" [class.segmented--disabled]="disabled()">
  <span class="segmented__label">{{ label() }}</span>

  <div class="segmented__group" role="radiogroup">
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="segmented__option"
        [class.segmented__option--active]="value() === option.value"
        [disabled]="disabled() || option.disabled"
        [attr.aria-pressed]="value() === option.value"
        (click)="selectOption(option)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</div>
