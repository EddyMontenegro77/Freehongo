<section class="file-upload" [class.file-upload--disabled]="disabled()">
  <input
    #fileInput
    class="file-upload__input"
    type="file"
    [accept]="accept()"
    [multiple]="multiple()"
    [disabled]="disabled()"
    (change)="onInput($event)"
  />

  <button
    class="file-upload__dropzone"
    type="button"
    [disabled]="disabled()"
    [class.file-upload__dropzone--dragging]="isDragging()"
    (click)="openPicker(fileInput)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <span class="file-upload__label">{{ label() }}</span>
    <span class="file-upload__hint">{{ hint() }}</span>
  </button>

  @if (items().length) {
    <div class="file-upload__items" aria-live="polite">
      @for (item of items(); track item.id; let index = $index) {
        <article
          class="file-upload__item"
          [draggable]="allowReorder()"
          (dragstart)="onItemDragStart(index, $event)"
          (dragover)="$event.preventDefault()"
          (drop)="onItemDrop(index, $event)"
        >
          @if (item.previewUrl) {
            <img class="file-upload__preview" [src]="item.previewUrl" [alt]="item.file.name" />
          } @else {
            <span class="file-upload__file-icon" aria-hidden="true">FILE</span>
          }
          <span class="file-upload__name" [title]="item.file.name">{{ item.file.name }}</span>
          <button
            class="file-upload__remove"
            type="button"
            (click)="remove(index)"
            aria-label="Remove file"
          >
            x
          </button>
        </article>
      }
    </div>
  }
</section>
