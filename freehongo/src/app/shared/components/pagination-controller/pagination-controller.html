<div class="pagination">
  <div class="pagination__field">
    <app-input
      label="Page"
      type="number"
      placeholder="1"
      [value]="selectedPage().toString()"
      (valueChange)="onPageValueChange($event)"
      [min]="1"
      [max]="totalPages()"
    />

    <span class="pagination__total"> of {{ totalPages() }} </span>
  </div>

  <div class="pagination__actions">
    <app-action-btn title="Previous" [action]="previousPage" [disabled]="currentPage() <= 1" />

    <app-action-btn
      title="Next"
      [action]="nextPage"
      [disabled]="currentPage() >= totalPages()"
      variant="light"
    />
    <app-action-btn
      title="Go"
      [action]="selectPage"
      [disabled]="!canSelectPage()"
      variant="accent"
    />
  </div>
</div>
