@if (listType() === 'ol') {
  <ol class="list" [style.list-style-type]="marker()" [attr.aria-label]="ariaLabel()">
    @for (item of items(); track $index) {
      <li class="list__item">{{ item }}</li>
    }
  </ol>
} @else {
  <ul class="list" [style.list-style-type]="marker()" [attr.aria-label]="ariaLabel()">
    @for (item of items(); track $index) {
      <li class="list__item">{{ item }}</li>
    }
  </ul>
}
