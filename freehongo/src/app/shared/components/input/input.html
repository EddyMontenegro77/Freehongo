<label class="field" [class.field--disabled]="disabled()">
  <span class="field__label">
    {{ label() }}
    @if (required()) {
      <span class="field__required" aria-hidden="true">*</span>
    }
  </span>

  <input
    class="field__control"
    [attr.type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.autocomplete]="autocomplete() || null"
    [attr.min]="min()"
    [attr.max]="max()"
    [attr.step]="step()"
    [class.default]="variant() === 'default'"
    [class.outline]="variant() === 'outline'"
    (input)="onInput($event)"
    (blur)="touch.emit()"
  />

  @if (helperText()) {
    <span class="field__helper">{{ helperText() }}</span>
  }

  @if (displayError()) {
    <span class="field__error">{{ displayError() }}</span>
  }
</label>
