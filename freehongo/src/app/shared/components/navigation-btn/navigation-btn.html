<button
  type="button"
  [class.full-width]="fullWidth()"
  (click)="navigate()"
  [disabled]="disabled() || busy()"
>
  @if (icon()) {
    <span
      class="icon"
      [class.icon--original]="keepIconColors()"
      aria-hidden="true"
      [style.--icon-url]="'url(' + icon() + ')'"
    ></span>
  }
  @if (showText()) {
    <span class="label" [class.label--bold]="bold()">{{ title() }}</span>
  }
</button>
