<button
  type="button"
  [class.full-width]="fullWidth()"
  (click)="navigate()"
  [disabled]="disabled() || busy()"
>
  @if (icon()) {
    <span class="icon" aria-hidden="true" [style.--icon-url]="'url(' + icon() + ')'"></span>
  }
  @if (showText()) {
    <span class="label">{{ title() }}</span>
  }
</button>
