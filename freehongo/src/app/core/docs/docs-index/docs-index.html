<main class="docs-index" aria-labelledby="docs-title">
  <header class="docs-index__header">
    <p class="eyebrow">FreeHonGo documentation</p>
    <h1 id="docs-title">Docs</h1>
    <p>Browse the documentation and live examples available for the project.</p>
  </header>

  <nav class="docs-index__list" aria-label="Documentation pages">
    @for (documentation of documentationLinks; track documentation.route) {
      <a class="docs-index__link" [routerLink]="documentation.route">
        <span>
          <strong>{{ documentation.label }}</strong>
          <span>{{ documentation.description }}</span>
        </span>
        <span class="docs-index__arrow" aria-hidden="true">→</span>
      </a>
    }
  </nav>
</main>
