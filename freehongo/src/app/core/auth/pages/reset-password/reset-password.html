<form class="reset-password" [formRoot]="resetForm">
  <h1>Reset password</h1>
  @if (isProcessing()) {
    <app-loading-state message="Updating password..." />
  } @else {
    <app-input label="Password" type="password" [formField]="resetForm.password" />
    <app-input label="Password confirmation" type="password" [formField]="resetForm.confirmation" />
    @if (message(); as message) {
      <p role="alert">{{ message }}</p>
    }
    <app-action-btn title="Update password" type="submit" variant="accent" />
  }
</form>
